<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>认知障碍早期筛查 · 聊天式采集</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="t-left">
      <button id="btnHome" class="iconbtn" title="返回首页" aria-label="返回首页">⌂</button>
      <div class="brandlockup">
        <span class="brandmark" aria-hidden="true">脑</span>
        <span class="ttitle">认知筛查</span>
        <span class="tcaption">临床数据采集</span>
      </div>
    </div>
    <div class="t-right">
      <span id="roleBadge" class="rolebadge"></span>
      <select id="roleSelect" class="role" title="角色切换">
        <option value="rater">主试（医生）</option>
        <option value="self">受试者（自评）</option>
        <option value="informant">家属（知情者）</option>
      </select>
      <span id="saveStatus" class="save-status" aria-live="polite">已保存</span>
      <span id="cloudStatus" class="cloud-status" aria-live="polite"></span>
      <span id="offlineDot" class="offline">● 在线</span>
      <span id="userBadge" class="rolebadge" hidden></span>
      <button id="acctBtn" class="iconbtn" title="账号管理" aria-label="账号管理">⚙</button>
      <button id="logoutBtn" class="iconbtn" title="退出登录" aria-label="退出登录">⏻</button>
    </div>
  </header>

  <!-- 首页 -->
  <main id="home" class="home"></main>

  <!-- 聊天区 -->
  <section id="chatWrap" class="chatwrap" style="display:none;">
    <div id="chat" class="chat"></div>
    <div id="composer" class="composer"></div>
  </section>

  <!-- 综合诊断报告浮层 -->
  <div id="report" class="report-overlay" style="display:none;"></div>

  <!-- 本地表格导入：文件只在浏览器内读取，不上传网络 -->
  <input id="patientFileInput" class="visually-hidden" type="file"
    accept=".csv,.tsv,.xls,text/csv,text/tab-separated-values,application/vnd.ms-excel" />

  <!-- 登录遮罩（演示级，纯前端校验，不联网） -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div class="login-brand"><span aria-hidden="true">脑</span> 认知筛查 · 临床数据采集</div>
      <div class="login-sub">演示系统 · 请登录后进入工作台</div>
      <select id="loginRole" class="login-input login-role" title="登录身份">
        <option value="rater">主试（医生）</option>
        <option value="self">受试者（自评）</option>
        <option value="informant">家属（知情者）</option>
      </select>
      <input id="loginUser" class="login-input" type="text" placeholder="用户名（演示：admin）" autocomplete="username" />
      <input id="loginPwd" class="login-input" type="password" placeholder="密码（演示：123456）" autocomplete="current-password" />
      <button id="loginBtn" class="login-btn" type="button">进入系统</button>
      <div class="login-hint">演示账号 admin / 123456（本地校验，不联网、不加密）</div>
    </div>
  </div>

  <script>window.API_BASE = "http://localhost:8000";</script>
  <script src="scales.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
